<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Personal | Yuju Repostería</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --primary: #4a1525; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #2d0b15 0%, #4a1525 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card-reg {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .btn-gourmet {
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            border: none;
        }
        .btn-gourmet:hover { background: #6a2439; color: white; }
    </style>
</head>
<body>

<div class="card-reg">
    <div class="text-center mb-4">
        <div class="fs-1 mb-1">🍰</div>
        <h3 class="fw-bold" style="color: var(--primary); font-family: 'Playfair Display', serif;">Registro de Personal</h3>
        <p class="text-muted small">Crea una cuenta para acceder a la plataforma operativa</p>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Nombre Completo</label>
            <input type="text" th:field="*{nombreCompleto}" class="form-control" placeholder="Ej: Marcel Dubois" required />
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold text-muted">Nombre de Usuario</label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="usuario.empleado" required />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold text-muted">Contraseña</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required />
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Correo Electrónico Corporativo</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="empleado@yujureposteria.com" required />
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-muted">Rol en la Empresa</label>
            <select th:field="*{rol}" class="form-select" required>
                <option value="ADMIN">Administrador General</option>
                <option value="VENDEDOR">Asesor de Ventas</option>
                <option value="PASTELERO">Pastelero / Producción</option>
            </select>
        </div>

        <button type="submit" class="btn btn-gourmet mb-3">
            <i class="bi bi-check-lg me-1"></i> Registrar Empleado
        </button>

        <div class="text-center">
            <a th:href="@{/login}" class="text-decoration-none small text-muted">
                ¿Ya tienes cuenta? <strong>Iniciar Sesión</strong>
            </a>
        </div>
    </form>
</div>

</body>
</html>
