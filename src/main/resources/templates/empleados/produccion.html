<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Producciones Asignadas - ' + ${empleado.nombreCompleto})}"></head>
<body>

<div th:replace="~{fragments/base :: sidebar('empleados')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/base :: topbar('Producción Asignada al Maestro Repostero')}"></div>

    <div class="card-custom p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <span class="badge bg-warning text-dark" th:text="${empleado.cargo.descripcion}">Cargo</span>
                <h3 class="brand-font mb-1" style="color: var(--primary);" th:text="${empleado.nombreCompleto}">Nombre</h3>
                <p class="text-muted small mb-0">
                    <i class="bi bi-clock me-1"></i> Turno: <strong th:text="${empleado.turno.descripcion}"></strong> |
                    <i class="bi bi-tools me-1"></i> Especialidad: <span th:text="${empleado.funciones}"></span>
                </p>
            </div>
            <a th:href="@{/empleados}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver a Empleados</a>
        </div>
    </div>

    <div class="card-custom p-4">
        <h5 class="brand-font mb-3" style="color: var(--primary);">Lotes y Órdenes de Producción Asignadas</h5>
        <div class="table-responsive">
            <table class="table table-custom table-hover">
                <thead>
                    <tr>
                        <th>Código Lote</th>
                        <th>Producto a Elaborar</th>
                        <th>Planificado</th>
                        <th>Producido</th>
                        <th>Mermas</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${producciones}">
                        <td class="fw-bold text-primary" th:text="${p.codigoLote}">LOTE</td>
                        <td class="fw-bold" th:text="${p.producto.nombre}">Producto</td>
                        <td><span class="badge bg-light text-dark border" th:text="${p.cantidadPlanificada} + ' un.'">0</span></td>
                        <td><span class="badge bg-success" th:text="${p.cantidadProducida} + ' un.'">0</span></td>
                        <td><span class="badge bg-danger" th:text="${p.mermas} + ' un.'">0</span></td>
                        <td>
                            <span class="badge badge-status"
                                  th:classappend="${p.estado.name() == 'TERMINADO' ? 'bg-success' : (p.estado.name() == 'EN_PROCESO' ? 'bg-warning text-dark' : 'bg-secondary')}"
                                  th:text="${p.estado.descripcion}">Estado</span>
                        </td>
                        <td class="small text-muted" th:text="${#temporals.format(p.fechaPlanificada, 'dd/MM/yyyy')}">Fecha</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(producciones)}">
                        <td colspan="7" class="text-center text-muted py-5">Este empleado no tiene producciones asignadas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
