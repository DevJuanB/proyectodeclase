<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Ventas por Vendedor - ' + ${empleado.nombreCompleto})}"></head>
<body>

<div th:replace="~{fragments/base :: sidebar('empleados')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/base :: topbar('Rendimiento y Ventas del Asesor')}"></div>

    <div class="card-custom p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <span class="badge bg-info text-dark">Asesor de Ventas</span>
                <h3 class="brand-font mb-1" style="color: var(--primary);" th:text="${empleado.nombreCompleto}">Nombre</h3>
                <p class="text-muted small mb-0">
                    <i class="bi bi-clock me-1"></i> Turno: <strong th:text="${empleado.turno.descripcion}"></strong> |
                    <i class="bi bi-telephone me-1"></i> Teléfono: <span th:text="${empleado.telefono}"></span> |
                    <i class="bi bi-envelope me-1"></i> Email: <span th:text="${empleado.email}"></span>
                </p>
            </div>
            <a th:href="@{/empleados}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver a Empleados</a>
        </div>
    </div>

    <div class="card-custom p-4">
        <h5 class="brand-font mb-3" style="color: var(--primary);">Ventas Cerradas por este Vendedor</h5>
        <div class="table-responsive">
            <table class="table table-custom table-hover">
                <thead>
                    <tr>
                        <th>N° Factura</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Tipo Venta</th>
                        <th>Estado</th>
                        <th>Total</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${ventas}">
                        <td class="fw-bold text-primary" th:text="${v.numeroFactura}">FAC</td>
                        <td th:text="${#temporals.format(v.fechaPedido, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                        <td th:text="${v.cliente.nombreCompleto}">Cliente</td>
                        <td>
                            <span class="badge" th:classappend="${v.tipoVenta.name() == 'MAYORISTA' ? 'bg-primary' : 'bg-light text-dark'}" th:text="${v.tipoVenta.descripcion}"></span>
                        </td>
                        <td>
                            <span class="badge badge-status"
                                  th:classappend="${v.estado.name() == 'ENTREGADO' ? 'bg-success' : 'bg-warning text-dark'}"
                                  th:text="${v.estado.descripcion}">Estado</span>
                        </td>
                        <td class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(v.total, 0, 'POINT', 0, 'COMMA')}">$0</td>
                        <td class="text-end">
                            <a th:href="@{'/pedidos/detalle/' + ${v.id}}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></a>
                            <a th:href="@{'/pedidos/pdf/' + ${v.id}}" class="btn btn-sm btn-outline-danger"><i class="bi bi-file-earmark-pdf"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="7" class="text-center text-muted py-5">Este asesor aún no tiene ventas registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
