<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'})}"></head>
<body>

<div th:replace="~{fragments/base :: sidebar('productos')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/base :: topbar(${producto.id == null ? 'Registrar Nuevo Producto' : 'Editar Producto'})}"></div>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <div class="card-custom p-4" style="max-width: 900px; margin: 0 auto;">
        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">Código de Referencia</label>
                    <input type="text" th:field="*{codigo}" class="form-control" placeholder="Ej: TOR-003" />
                </div>
                <div class="col-md-8">
                    <label class="form-label small fw-bold text-muted">Nombre del Producto *</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Torta Ópera Francesa" required />
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">Categoría / Tipo de Producto *</label>
                    <select th:field="*{tipo}" class="form-select" required>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descripcion}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Presentación</label>
                    <input type="text" th:field="*{presentacion}" class="form-control" placeholder="Ej: Unidad entera, Caja x 6" />
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Tamaño / Porciones</label>
                    <input type="text" th:field="*{tamano}" class="form-control" placeholder="Ej: 1.5 kg (12 porc.)" />
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">Precio Venta Minorista (Al Detal) *</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" th:field="*{precioMinorista}" class="form-control" placeholder="0.00" required />
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">Precio Venta Mayorista (Eventos) *</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" th:field="*{precioMayorista}" class="form-control" placeholder="0.00" required />
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">Stock en Vitrina / Bodega</label>
                    <input type="number" th:field="*{stock}" class="form-control" placeholder="0" />
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">Stock Mínimo (Alerta)</label>
                    <input type="number" th:field="*{stockMinimo}" class="form-control" placeholder="5" />
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">Estado</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" th:field="*{disponible}" id="dispCheck">
                        <label class="form-check-label" for="dispCheck">Disponible para la venta</label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label small fw-bold text-muted">Descripción del Producto</label>
                    <textarea th:field="*{descripcion}" rows="2" class="form-control" placeholder="Breve reseña gourmet del producto..."></textarea>
                </div>

                <div class="col-12">
                    <label class="form-label small fw-bold text-muted">Ingredientes Principales</label>
                    <textarea th:field="*{ingredientes}" rows="2" class="form-control" placeholder="Harina, mantequilla, cacao, huevos, vainilla natural..."></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">Posibles Alérgenos</label>
                    <input type="text" th:field="*{alergenos}" class="form-control" placeholder="Ej: Contiene gluten, lácteos, huevo, frutos secos" />
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">Condiciones de Almacenamiento</label>
                    <input type="text" th:field="*{condicionesAlmacenamiento}" class="form-control" placeholder="Ej: Refrigeración a 4°C. Consumo antes de 5 días." />
                </div>

                <div class="col-12">
                    <label class="form-label small fw-bold text-muted">URL de Imagen (Opcional)</label>
                    <input type="url" th:field="*{imagenUrl}" class="form-control" placeholder="https://..." />
                </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-gourmet">
                    <i class="bi bi-save me-1"></i> Guardar Producto
                </button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
