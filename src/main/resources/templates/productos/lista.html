<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Productos de Repostería')}"></head>
<body>

<div th:replace="~{fragments/base :: sidebar('productos')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/base :: topbar('Gestión de Productos de Repostería')}"></div>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <!-- Barra de Búsqueda, Filtros y Acciones -->
    <div class="card-custom p-3 mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-5">
                <form th:action="@{/productos}" method="get" class="d-flex gap-2">
                    <input type="text" name="buscar" th:value="${buscar}" class="form-control" placeholder="Buscar por código o nombre..." />
                    <button type="submit" class="btn btn-gourmet"><i class="bi bi-search"></i></button>
                    <a th:if="${buscar != null or tipoSeleccionado != null}" th:href="@{/productos}" class="btn btn-outline-secondary" title="Limpiar"><i class="bi bi-x-lg"></i></a>
                </form>
            </div>
            <div class="col-md-3">
                <form th:action="@{/productos}" method="get">
                    <select name="tipo" onchange="this.form.submit()" class="form-select">
                        <option value="">-- Todos los Tipos --</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descripcion}" th:selected="${tipoSeleccionado == t}"></option>
                    </select>
                </form>
            </div>
            <div class="col-md-4 text-end d-flex gap-2 justify-content-end">
                <a th:href="@{/productos/catalogo-pdf}" class="btn btn-pdf">
                    <i class="bi bi-file-earmark-pdf me-1"></i> Catálogo PDF
                </a>
                <a th:href="@{/productos/nuevo}" class="btn btn-gourmet">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
                </a>
            </div>
        </div>
    </div>

    <!-- Tabla de Productos -->
    <div class="card-custom p-4">
        <div class="table-responsive">
            <table class="table table-custom table-hover">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio Minorista</th>
                        <th>Precio Mayorista</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${productos}">
                        <td style="width: 60px;">
                            <img th:src="${p.imagenUrl != null ? p.imagenUrl : 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=100&q=80'}"
                                 alt="Producto" class="rounded-3 shadow-sm object-fit-cover" style="width: 48px; height: 48px;" />
                        </td>
                        <td class="fw-bold text-muted" th:text="${p.codigo}">COD</td>
                        <td>
                            <div class="fw-bold" style="color: var(--primary);" th:text="${p.nombre}">Nombre Producto</div>
                            <small class="text-muted" th:text="${p.presentacion} + ' | ' + ${p.tamano}">Presentación</small>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${p.tipo.descripcion}">Tipo</span>
                        </td>
                        <td class="fw-semibold text-success" th:text="'$' + ${#numbers.formatDecimal(p.precioMinorista, 0, 'POINT', 0, 'COMMA')}">$0</td>
                        <td class="fw-semibold" style="color: var(--secondary);" th:text="'$' + ${#numbers.formatDecimal(p.precioMayorista, 0, 'POINT', 0, 'COMMA')}">$0</td>
                        <td>
                            <span class="badge" th:classappend="${p.stock <= p.stockMinimo ? 'bg-danger' : 'bg-success'}" th:text="${p.stock}">0</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${p.disponible ? 'bg-success' : 'bg-secondary'}" th:text="${p.disponible ? 'Disponible' : 'Agotado'}"></span>
                        </td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{'/productos/detalle/' + ${p.id}}" class="btn btn-outline-secondary" title="Ficha Técnica & Alérgenos">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{'/productos/editar/' + ${p.id}}" class="btn btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{'/productos/eliminar/' + ${p.id}}" onclick="return confirm('¿Seguro que deseas eliminar este producto?');" class="btn btn-outline-danger" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                            No se encontraron productos con los criterios especificados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
