<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Gestión de Clientes')}"></head>
<body>

<div th:replace="~{fragments/base :: sidebar('clientes')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/base :: topbar('Gestión de Clientes')}"></div>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <!-- Filtros y Acciones -->
    <div class="card-custom p-3 mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-5">
                <form th:action="@{/clientes}" method="get" class="d-flex gap-2">
                    <input type="text" name="buscar" th:value="${buscar}" class="form-control" placeholder="Buscar por documento o nombre..." />
                    <button type="submit" class="btn btn-gourmet"><i class="bi bi-search"></i></button>
                    <a th:if="${buscar != null or tipoSeleccionado != null}" th:href="@{/clientes}" class="btn btn-outline-secondary"><i class="bi bi-x-lg"></i></a>
                </form>
            </div>
            <div class="col-md-3">
                <form th:action="@{/clientes}" method="get">
                    <select name="tipo" onchange="this.form.submit()" class="form-select">
                        <option value="">-- Todos los Tipos --</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descripcion}" th:selected="${tipoSeleccionado == t}"></option>
                    </select>
                </form>
            </div>
            <div class="col-md-4 text-end">
                <a th:href="@{/clientes/nuevo}" class="btn btn-gourmet">
                    <i class="bi bi-person-plus-fill me-1"></i> Registrar Cliente
                </a>
            </div>
        </div>
    </div>

    <!-- Tabla de Clientes -->
    <div class="card-custom p-4">
        <div class="table-responsive">
            <table class="table table-custom table-hover">
                <thead>
                    <tr>
                        <th>Doc / NIT</th>
                        <th>Cliente / Razón Social</th>
                        <th>Tipo de Cliente</th>
                        <th>Teléfono</th>
                        <th>Correo Electrónico</th>
                        <th>Dirección</th>
                        <th>Fecha Registro</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clientes}">
                        <td class="fw-bold text-muted" th:text="${c.documento}">DOC</td>
                        <td class="fw-bold" style="color: var(--primary);" th:text="${c.nombreCompleto}">Nombre</td>
                        <td>
                            <span class="badge" th:classappend="${c.tipoCliente.name() == 'MAYORISTA' ? 'bg-primary' : 'bg-light text-dark border'}"
                                  th:text="${c.tipoCliente.descripcion}">Tipo</span>
                        </td>
                        <td th:text="${c.telefono}">Tel</td>
                        <td>
                            <a th:href="'mailto:' + ${c.email}" class="text-decoration-none text-muted" th:text="${c.email}">correo</a>
                        </td>
                        <td class="small text-muted" th:text="${c.direccion}">Dir</td>
                        <td class="small text-muted" th:text="${#temporals.format(c.fechaRegistro, 'dd/MM/yyyy')}">Fecha</td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{'/clientes/historial/' + ${c.id}}" class="btn btn-outline-info" title="Historial de Compras">
                                    <i class="bi bi-clock-history"></i> Historial
                                </a>
                                <a th:href="@{'/clientes/editar/' + ${c.id}}" class="btn btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{'/clientes/eliminar/' + ${c.id}}" onclick="return confirm('¿Seguro que deseas eliminar este cliente?');" class="btn btn-outline-danger" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-people fs-2 d-block mb-2"></i>
                            No se encontraron clientes registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
