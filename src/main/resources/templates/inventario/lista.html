<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Gestión de Inventario')}"></head>
<body>

<div th:replace="~{fragments/base :: sidebar('inventario')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/base :: topbar('Inventario & Materias Primas')}"></div>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <div class="card-custom p-3 mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-5">
                <form th:action="@{/inventario}" method="get" class="d-flex gap-2">
                    <input type="text" name="buscar" th:value="${buscar}" class="form-control" placeholder="Buscar por código o insumo..." />
                    <button type="submit" class="btn btn-gourmet"><i class="bi bi-search"></i></button>
                    <a th:if="${buscar != null}" th:href="@{/inventario}" class="btn btn-outline-secondary"><i class="bi bi-x-lg"></i></a>
                </form>
            </div>
            <div class="col-md-7 text-end d-flex gap-2 justify-content-end">
                <a th:href="@{/inventario/kardex}" class="btn btn-outline-primary">
                    <i class="bi bi-journal-text me-1"></i> Ver Movimientos (Kardex)
                </a>
                <button type="button" class="btn btn-warning text-dark fw-bold" data-bs-toggle="modal" data-bs-target="#modalMovimiento">
                    <i class="bi bi-arrow-left-right me-1"></i> Entrada / Salida Stock
                </button>
                <a th:href="@{/inventario/nuevo}" class="btn btn-gourmet">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo Insumo
                </a>
            </div>
        </div>
    </div>

    <!-- Tabla de Materias Primas -->
    <div class="card-custom p-4">
        <div class="table-responsive">
            <table class="table table-custom table-hover">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Insumo / Materia Prima</th>
                        <th>Unidad</th>
                        <th>Stock Actual</th>
                        <th>Stock Mínimo</th>
                        <th>Costo Unitario</th>
                        <th>Valor Total</th>
                        <th>Alerta Stock</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${materiasPrimas}">
                        <td class="fw-bold text-muted" th:text="${m.codigo}">COD</td>
                        <td class="fw-bold" style="color: var(--primary);" th:text="${m.nombre}">Harina</td>
                        <td><span class="badge bg-light text-dark border" th:text="${m.unidadMedida}">kg</span></td>
                        <td>
                            <strong class="fs-6" th:text="${#numbers.formatDecimal(m.stockActual, 0, 'POINT', 2, 'COMMA')}">0.00</strong>
                        </td>
                        <td class="text-muted" th:text="${#numbers.formatDecimal(m.stockMinimo, 0, 'POINT', 2, 'COMMA')}">0.00</td>
                        <td th:text="'$' + ${#numbers.formatDecimal(m.costoUnitario, 0, 'POINT', 0, 'COMMA')}">$0</td>
                        <td class="fw-semibold text-secondary" th:text="'$' + ${#numbers.formatDecimal(m.stockActual * m.costoUnitario, 0, 'POINT', 0, 'COMMA')}">$0</td>
                        <td>
                            <span class="badge" th:classappend="${m.bajoStock ? 'bg-danger' : 'bg-success'}"
                                  th:text="${m.bajoStock ? 'Stock Bajo' : 'Normal'}"></span>
                        </td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{'/inventario/editar/' + ${m.id}}" class="btn btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{'/inventario/eliminar/' + ${m.id}}" onclick="return confirm('¿Seguro de eliminar este insumo?');" class="btn btn-outline-danger" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(materiasPrimas)}">
                        <td colspan="9" class="text-center text-muted py-5">No hay insumos registrados en el inventario.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal para Registrar Movimiento Rápido de Inventario -->
<div class="modal fade" id="modalMovimiento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/inventario/movimiento}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" style="color: var(--primary);">Registrar Movimiento de Inventario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Insumo / Materia Prima *</label>
                        <select name="materiaPrimaId" class="form-select" required>
                            <option th:each="m : ${materiasPrimas}" th:value="${m.id}" th:text="${m.nombre} + ' (' + ${m.codigo} + ') - Stock Actual: ' + ${m.stockActual} + ' ' + ${m.unidadMedida}"></option>
                        </select>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Tipo de Operación *</label>
                            <select name="tipo" class="form-select" required>
                                <option value="ENTRADA">📥 Entrada / Compra</option>
                                <option value="SALIDA">📤 Salida / Consumo</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Cantidad *</label>
                            <input type="number" step="0.01" name="cantidad" class="form-control" placeholder="0.00" min="0.01" required />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Motivo / Documento de Soporte *</label>
                        <input type="text" name="motivo" class="form-control" placeholder="Ej: Compra Factura Molinos #402, Uso producción lote #12" required />
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-gourmet btn-sm">Guardar Movimiento</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
